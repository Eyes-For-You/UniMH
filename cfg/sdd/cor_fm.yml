description: Correlated FlowMatching
results_root_dir: outputs/sdd
dataset: sdd
past_frames:
- 2
- 4
- 6
- 8
future_frames:
- 4
- 8
- 12
max_past_frames: 8
max_future_frames: 12
test_past_frames: 8
test_future_frames: 12
agents: 1
eval_frames:
- 3
- 6
- 9
- 12
checkpt_freq: 10
denoising_method: fm
sampling_steps: 10
t_schedule: logit_normal
objective: pred_data
sigma_data: 0.0663
use_vqvae: true
vq_code_dim: 128
vq_num_codes: 64
vq_beta: 0.25
vq_rec_weight: 0.1
vq_loss_weight: 0.1
notes: Flow Matching
use_wandb: false
MODEL:
  NUM_PROPOSED_QUERY: 20
  MODEL_OUT_DIM: 24
  REGRESSION_MLPS:
  - 128
  - 256
  - 24
  CLASSIFICATION_MLPS:
  - 128
  - 128
  - 1
  MOE:
    NUM_EXPERTS: 4
    TOP_K: 2
    ENCODER_MOE: true
    DECODER_MOE: true
    AUX_LOSS_WEIGHT: 0.1
  CONTEXT_ENCODER:
    NAME: ETHEncoder
    NUM_INPUT_CONTEXT: 6
    SOCIAL_IN_DIM: 48
    AGENTS: 1
    NUM_CHANNEL_IN_MLP_AGENT: 256
    NUM_LAYER_IN_MLP_AGENT: 3
    D_MODEL: 128
    NUM_ATTN_LAYERS: 4
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.1
  MOTION_DECODER:
    NAME: MTRDecoder
    D_MODEL: 128
    NUM_DECODER_BLOCKS: 4
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.1
denoising_head_preds: 20
k_preds: 20
train_batch_size: 128
test_batch_size: 1024
OPTIMIZATION:
  NUM_EPOCHS: 150
  OPTIMIZER: AdamW
  LR: 0.0001
  WEIGHT_DECAY: 0.01
  SCHEDULER: cosineAnnealingLRwithWarmup
  LR_CLIP: 1.0e-06
  GRAD_NORM_CLIP: 1.0
  LOSS_WEIGHTS:
    cls: 1.0
    reg: 1.0
    vel: 0.2
